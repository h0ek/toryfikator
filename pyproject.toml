[project]
name = "toryfikator"
version = "0.4.2"
description = "Transparent Tor routing using nftables"
authors = [{name = "Hoek"}]
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
toryfikator = "toryfikator.cli:cli_main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["toryfikator*"]
